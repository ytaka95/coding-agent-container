name: Build and Push Claude-Code Image

on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 00:00 (UTC) に実行
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: base
  IMAGE_NAME: claude

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # プラットフォームごとにビルドしてダイジェストでプッシュ（タグなし）
      - name: Build and push by digest
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg CACHE_BUST=${{ github.run_id }} \
            --build-arg BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE_NAME }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --output type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true \
            --metadata-file /tmp/metadata.json \
            -f docker/claude-code/Dockerfile \
            .

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-slim
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log into registry ${{ env.REGISTRY }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # amd64 と arm64 のダイジェストを結合してマルチアーキマニフェストを作成
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=()
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"
          TAGS+=("${IMAGE}:sha-${SHORT_SHA}")

          if [ "${{ github.event_name }}" = "schedule" ]; then
            DATE_TAG=$(date -u +%Y%m%d)
            TAGS+=("${IMAGE}:${DATE_TAG}")
          fi

          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            TAGS+=("${IMAGE}:latest")
          fi

          TAG_ARGS=""
          for tag in "${TAGS[@]}"; do
            TAG_ARGS="${TAG_ARGS} -t ${tag}"
          done

          echo "INSPECT_TAG=${IMAGE}:sha-${SHORT_SHA}" >> $GITHUB_ENV

          docker buildx imagetools create \
            ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.INSPECT_TAG }}
